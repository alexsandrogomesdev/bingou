services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bingou_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "1171:1171"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - bingou_net

  postgres:
    image: postgres:16-alpine
    container_name: bingou_db
    restart: always
    command: postgres -p 1172
    environment:
      POSTGRES_DB: bingou
      POSTGRES_USER: bingou_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "1172:1172"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/databases/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 1172"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - bingou_net

volumes:
  pgdata:

networks:
  bingou_net:
    driver: bridge
